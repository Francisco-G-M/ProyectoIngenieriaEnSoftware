<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Préstamos - Prototipo CU_04</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 20px; }
        button:hover { background-color: #218838; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Solicitud de Préstamo (CU_04)</h2>
        <form id="formPrestamo">
        <label for="estudianteId">Estudiante:</label>
        <select id="estudianteId" required>
            <option value="2">Estudiante Activo (Normal)</option>
            <option value="3">Estudiante Sancionado (Lista Negra)</option>
        </select>

            <label for="materiaNombre">Materia / Proyecto:</label>
            <input type="text" id="materiaNombre" value="Taller de Realización Audiovisual" required>

            <label for="equipos">Selección de Equipos:</label>
            <select id="equipos" required>
                <option value="1">Kit Cámara (1 Unidad)</option>
                <option value="1,1">Kit Cámara (2 Unidades - Exceder tope)</option>
                <option value="2">Kit Sonido (1 Unidad)</option>
            </select>

            <label for="horasAntelacion">Antelación del Pedido:</label>
            <select id="horasAntelacion" required>
                <option value="72">72 Horas (Flujo Regular - Aprobación Docente)</option>
                <option value="12">12 Horas (Flujo Excepcional - Autorización Extraordinaria)</option>
            </select>

            <label>
                <input type="checkbox" id="esGrupal" style="width: auto; margin-top: 15px;"> ¿Es Proyecto Grupal?
            </label>

            <button type="submit">Enviar Solicitud de Préstamo</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
